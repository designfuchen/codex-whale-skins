[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-whale-skins"
version = "0.1.2"
description = "Validate and install native Codex pet skins"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]
license = "MIT"

[project.scripts]
whale-skins = "whale_skins.cli:main"

[tool.setuptools.packages.find]
where = ["plugins/whale-skins/src"]
